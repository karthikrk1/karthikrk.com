name: CI

# Runs on every pull request into main, before anything reaches the deploy workflow (which publishes
# to karthikrk.com on every push to main).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same build the deploy runs, so a broken page fails here instead of in production.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # public/resume.pdf must be exactly what resume/resume.yaml builds (rebuilds are byte-identical),
  # so the published PDF can never drift from its source.
  resume:
    name: resume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags (no moving `v10`), so pin the commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Rebuild the résumé
        run: npm run resume

      - name: Check the committed PDF matches its source
        run: |
          if ! git diff --quiet -- public/resume.pdf; then
            echo "::error file=public/resume.pdf::public/resume.pdf is out of date with resume/resume.yaml. Run 'npm run resume' and commit the result."
            exit 1
          fi
          echo "public/resume.pdf matches resume/resume.yaml"
