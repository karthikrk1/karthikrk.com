name: Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run this workflow manually from the GitHub Actions tab

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
      
      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          if [ -d dist/_astro ]; then
            aws s3 sync dist/_astro "s3://${{ .secrets/S3_BUCKET }}/_astro" --cache-control "public, max-age=31536000, immutable"
          fi
          aws s3 sync dist "s3://${{ secrets.S3_BUCKET }}" --delete --exclude "_astro/*" --cache-control "public, max-age=300"
      
      - name: Clear Cloudfront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"